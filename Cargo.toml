[package]
edition = "2024"
name = "claude-usage-metrics"
version = "0.1.0"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
opentelemetry = { version = "0.31.0", default-features = false, features = [
  "trace",
  "metrics",
] }
opentelemetry-otlp = { version = "0.31.0", features = [
  "trace",
  "metrics",
  "grpc-tonic",
] }
opentelemetry_sdk = { version = "0.31.0", features = [
  "trace",
  "metrics",
  "rt-tokio",
] }
prost = "0.14"
seher = { version = "=0.0.27", package = "sehercode", default-features = false }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1.44"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
