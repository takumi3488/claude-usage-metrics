name: "Buf Generate"
description: "Set up Buf and generate code from proto"
runs:
  using: "composite"
  steps:
    - name: Set up Buf
      uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1

    - name: Generate code from proto
      shell: bash
      run: |
        mkdir -p src/proto
        buf generate
