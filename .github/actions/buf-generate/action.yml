name: "Buf Generate"
description: "Set up Buf and generate code from proto"
runs:
  using: "composite"
  steps:
    - name: Set up Buf
      uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1

    - name: Generate code from proto
      shell: bash
      run: |
        mkdir -p src/proto
        buf generate
